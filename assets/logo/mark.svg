<!--
  MURTHER FABRIQUE — the mark.

  Pure geometry, no font, no filter, no gradient mesh: it has to survive being
  redrawn at 16 px by Windows' icon cache and at 512 px on a README. The only
  thing that changes between those two sizes is the stroke weight (see
  make-logos.ps1, which owns the small-size variant).

  Original artwork, created for this repository. No third-party brand, no stock
  image, no traced asset. Same terms as the repository: MIT.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="MURTHER FABRIQUE">
  <title>MURTHER FABRIQUE</title>
  <defs>
    <!-- Two flat stops, not a blur: a gradient that reads as depth at 512 px
         turns to mush at 16 px. -->
    <linearGradient id="mfPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182142"/>
      <stop offset="1" stop-color="#080B18"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#mfPlate)"/>

  <!-- The M. One polyline, miter joins, flat caps: at 16 px a round cap eats a
       third of the stroke and the letter closes up.
       miter-limit="2" is the load-bearing number. The two top corners need a
       miter ratio of about 2.6, so they get cut flat; the centre notch needs only
       1.41 and stays sharp. That is the whole difference between an M and an
       industrial-looking M, for one integer. -->
  <path d="M16 47V23l16 16 16-16v24" fill="none" stroke="#FF7A1A" stroke-width="8"
        stroke-linejoin="miter" stroke-linecap="butt" stroke-miterlimit="2"/>
</svg>